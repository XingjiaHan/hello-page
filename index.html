<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来自 hanxingjia 的小问候 ✿</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;position:relative;transition:background 1.2s;
    background-size:400% 400%;animation:bg 14s ease infinite;}
  @keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

  /* Time-based palettes */
  body[data-time=morning]   {background:linear-gradient(135deg,#ffd9b3,#ffe6d5,#cce5ff,#fff5d6)}
  body[data-time=noon]      {background:linear-gradient(135deg,#b3e0ff,#e6f5ff,#fff9d6,#d6f5e6)}
  body[data-time=afternoon] {background:linear-gradient(135deg,#ffd6e8,#c5e0ff,#ffe5b4,#ffd6e8)}
  body[data-time=evening]   {background:linear-gradient(135deg,#ff9ec7,#c489d4,#7b73c1,#3d3270)}
  body[data-time=night]     {background:linear-gradient(135deg,#0f0a2e,#1a1a3e,#2d1b69,#0a0a1f);animation:none}

  /* Card */
  .card{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
    border-radius:24px;padding:48px 56px;box-shadow:0 20px 60px rgba(0,0,0,.08);
    text-align:center;max-width:90vw;animation:pop .6s cubic-bezier(.34,1.56,.64,1);
    position:relative;z-index:10;transition:background 1s,color 1s;}
  body[data-time=night] .card{background:rgba(30,30,60,.55);color:#f0f0ff;
    box-shadow:0 20px 60px rgba(255,255,255,.05),0 0 80px rgba(180,150,255,.15)}
  body[data-time=night] .hello{color:#f0f0ff}
  body[data-time=night] .msg{color:#c9c9e8}
  body[data-time=night] .footer{color:#9090c0}
  body[data-time=evening] .card{background:rgba(255,255,255,.78)}
  @keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .face{font-size:48px;margin-bottom:16px;letter-spacing:2px;}
  .hello{font-size:28px;color:#444;margin:8px 0;}
  .name{color:#ff6b9d;font-weight:600;}
  body[data-time=night] .name{color:#ffb3d9;text-shadow:0 0 8px rgba(255,150,200,.5)}
  .msg{font-size:18px;color:#666;margin-top:20px;line-height:1.6;}
  .actions{margin-top:32px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .refresh,.game{padding:10px 24px;border:none;border-radius:999px;
    font-size:14px;cursor:pointer;transition:transform .2s;text-decoration:none;
    display:inline-block;}
  .refresh{background:#ff6b9d;color:white;}
  .refresh:hover{transform:scale(1.05);background:#ff5491;}
  .game{background:rgba(255,255,255,.6);color:#ff5491;border:1.5px solid #ffb3d9;}
  .game:hover{transform:scale(1.05);background:#fff;}
  body[data-time=night] .game{background:rgba(255,255,255,.1);color:#ffb3d9;border-color:rgba(255,179,217,.4);}
  .footer{margin-top:20px;font-size:12px;color:#aaa;}

  /* Countdown to off-work */
  .countdown{margin-top:26px;padding:14px 18px;border-radius:16px;
    background:rgba(255,107,157,.08);border:1px dashed rgba(255,107,157,.25);
    text-align:left;}
  .countdown .row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;}
  .cdlabel{font-size:12px;color:#999;letter-spacing:1.5px;}
  .cdtime{font-family:"SF Mono","Menlo","Consolas",monospace;font-weight:600;
    font-size:26px;color:#ff5491;letter-spacing:1px;}
  .cdbar{height:5px;background:rgba(255,107,157,.12);border-radius:999px;
    margin-top:8px;overflow:hidden;}
  .cdbar>div{height:100%;background:linear-gradient(90deg,#ffb3d9,#ff6b9d);
    border-radius:999px;transition:width .4s;width:0;}
  .cdquip{margin-top:8px;font-size:12px;color:#a48fa8;font-style:italic;
    min-height:16px;}
  body[data-time=night] .countdown{background:rgba(255,107,157,.1);
    border-color:rgba(255,179,217,.3);}
  body[data-time=night] .cdlabel{color:#a8a8c8;}
  body[data-time=night] .cdtime{color:#ffb3d9;text-shadow:0 0 8px rgba(255,150,200,.4);}
  body[data-time=night] .cdquip{color:#b09ad0;}
  .visits{position:fixed;top:14px;right:16px;z-index:50;
    padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.7);backdrop-filter:blur(10px);
    font-size:12px;color:#888;letter-spacing:.3px;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
    transition:opacity .6s;opacity:0;}
  .visits.show{opacity:1;}
  .visits b{color:#ff6b9d;font-weight:600;}
  body[data-time=night] .visits{background:rgba(30,30,60,.5);color:#c9c9e8;
    box-shadow:0 4px 14px rgba(0,0,0,.3);}
  body[data-time=night] .visits b{color:#ffb3d9;}

  /* Sakura petals */
  .petal{position:fixed;top:-30px;width:14px;height:18px;
    background:linear-gradient(135deg,#ffb3d9,#ffd6e8 60%,#fff0f5);
    border-radius:150% 0 150% 0;
    pointer-events:none;z-index:5;
    box-shadow:inset -1px -2px 3px rgba(255,107,157,.3);
    animation:fall linear forwards;}
  body[data-time=night] .petal{background:linear-gradient(135deg,#d9b3ff,#e6d6ff 60%,#f0e6ff);
    box-shadow:0 0 6px rgba(200,180,255,.4),inset -1px -2px 3px rgba(180,140,220,.4)}
  @keyframes fall{
    0%  {transform:translate(0,0) rotate(0)        ;opacity:0}
    8%  {opacity:.9}
    100%{transform:translate(var(--sway,80px),110vh) rotate(720deg);opacity:.7}
  }

  /* Stars (night only) */
  .star{position:fixed;background:white;border-radius:50%;
    pointer-events:none;z-index:2;animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3);box-shadow:0 0 6px #fff,0 0 12px #fff}}

  /* Click hearts */
  .heart{position:fixed;pointer-events:none;z-index:100;
    user-select:none;font-weight:bold;
    animation:floatup 1.6s ease-out forwards;}
  @keyframes floatup{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
    15% {opacity:1;transform:translate(-50%,-60%) scale(1.3) rotate(-10deg)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-220px) scale(.7) rotate(var(--rot,20deg))}
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="face" id="face"></div>
  <div class="hello" id="hello"></div>
  <div class="msg" id="msg"></div>

  <div class="countdown" id="cd">
    <div class="row">
      <span class="cdlabel" id="cdLabel">距下班</span>
      <span class="cdtime"  id="cdTime">--:--:--</span>
    </div>
    <div class="cdbar"><div id="cdProg"></div></div>
    <div class="cdquip" id="cdQuip"></div>
  </div>

  <div class="actions">
    <button class="refresh" id="refresh">再来一条</button>
    <a class="game" href="game.html">✈ 摸鱼</a>
    <a class="game" href="pet.html">🐱 云养猫</a>
  </div>
  <div class="footer">made with love by hanxingjia</div>
</div>
<div class="visits" id="visits"></div>
<script>
const faces=["(´｡• ᵕ •｡`)","( ˘ ³˘)","ヾ(•ω•`)o","(=^･ω･^=)","ฅ^•ﻌ•^ฅ",
  "(*≧ω≦*)","(づ｡◕‿‿◕｡)づ","(✿◠‿◠)","(っ´ω`c)","ʕ•ᴥ•ʔ"];
const msgs=["你今天看起来超棒！","记得喝水哦~","小小的鼓励送给你：你可以的！",
  "今天也要元气满满呀！","工作累了就抬头看看窗外吧~","无论今天怎样，你都很可爱！",
  "嘿嘿，被我抓到啦！要开心一点哦~","深呼吸，慢慢来，一切都会好的。",
  "你已经做得很好了，别太苛责自己 :)","一杯热茶送给屏幕前的你"];

function timeBucket(h){
  if(h>=5 && h<11)  return ["morning","早上好"];
  if(h>=11 && h<14) return ["noon","中午好"];
  if(h>=14 && h<18) return ["afternoon","下午好"];
  if(h>=18 && h<23) return ["evening","晚上好"];
  return ["night","夜深啦"];
}

function render(){
  const h=new Date().getHours();
  const [bucket,t]=timeBucket(h);
  document.body.dataset.time=bucket;
  const name=new URLSearchParams(location.search).get("name")||"朋友";
  document.getElementById("face").textContent=faces[Math.floor(Math.random()*faces.length)];
  // XSS-safe: build with DOM, no innerHTML on user input
  const helloEl=document.getElementById("hello");
  helloEl.textContent=t+"，";
  const ns=document.createElement("span");
  ns.className="name"; ns.textContent=name;
  helloEl.append(ns,"！");
  document.getElementById("msg").textContent=msgs[Math.floor(Math.random()*msgs.length)];
}

// ---- Sakura petals (always on) ----
function spawnPetal(){
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  const dur=8+Math.random()*9;
  p.style.animationDuration=dur+"s";
  p.style.setProperty("--sway",(Math.random()*300-150)+"px");
  const scale=.6+Math.random()*.8;
  p.style.width=(12*scale)+"px";
  p.style.height=(16*scale)+"px";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),dur*1000);
}
setInterval(spawnPetal,380);
for(let i=0;i<12;i++) setTimeout(spawnPetal,i*180);

// ---- Stars (night only) ----
function ensureStars(){
  const existing=document.querySelectorAll(".star");
  if(document.body.dataset.time!=="night"){
    existing.forEach(s=>s.remove());
    return;
  }
  if(existing.length>=80) return;
  const needed=80-existing.length;
  for(let i=0;i<needed;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    s.style.animationDelay=Math.random()*3+"s";
    const size=1+Math.random()*2.5;
    s.style.width=s.style.height=size+"px";
    document.body.appendChild(s);
  }
}
setInterval(ensureStars,2000);

// ---- Hearts on click (anywhere) ----
const heartChars=["♥","♡","❀","✿"];
const heartColors=["#ff6b9d","#ff8fab","#ffb3c6","#ffd6e8","#ff5491"];
document.addEventListener("click",e=>{
  const count=3+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent=heartChars[Math.floor(Math.random()*heartChars.length)];
    h.style.left=(e.clientX+(Math.random()*30-15))+"px";
    h.style.top=(e.clientY+(Math.random()*20-10))+"px";
    h.style.color=heartColors[Math.floor(Math.random()*heartColors.length)];
    h.style.fontSize=(20+Math.random()*18)+"px";
    h.style.setProperty("--dx",(Math.random()*120-60)+"px");
    h.style.setProperty("--rot",(Math.random()*60-30)+"deg");
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),1600);
  }
});

// Re-check time bucket each minute (page might stay open across boundaries)
setInterval(()=>{
  const [bucket]=timeBucket(new Date().getHours());
  if(document.body.dataset.time!==bucket){
    document.body.dataset.time=bucket;
    ensureStars();
  }
},60000);

// Refresh button changes message without firing the click-heart effect everywhere
document.getElementById("refresh").addEventListener("click",e=>{
  render();
});

render();
ensureStars();

// ---- Countdown to off-work ----
const WORK_START = 9, WORK_END = 18;
const cdLabel = document.getElementById("cdLabel");
const cdTime  = document.getElementById("cdTime");
const cdProg  = document.getElementById("cdProg");
const cdQuip  = document.getElementById("cdQuip");

const QUIPS_WORK = [
  "你看起来很忙，其实你只是在装忙",
  "工位是租的，灵魂是自己的",
  "钱包在等你下班，工作在等你接着干",
  "活儿可以摸，但样子要装",
  "上班 8 小时，焦虑 24 小时",
  "你不是在工作，是在为下班做准备",
  "今天又被工作偷走了一天",
  "你的笑容是 OKR 偷走的",
  "上班如上坟，下班如重生",
  "再坚持一下下，房贷也在坚持",
  "假装看屏幕的样子真专业",
  "时间正在以每秒一秒的速度老去你",
];
const QUIPS_WORK_LAST_HOUR = [
  "胜利在望，请勿现在崩溃",
  "最后一小时，演技要更精湛",
  "再 1 小时，世界还你",
  "马上就能脱牛马籍了",
];
const QUIPS_WORK_LAST_10 = [
  "起立，准备冲，姿势要优雅",
  "把鼠标移到关机键上",
  "下班的脚踏车已经就位",
  "10 分钟后，你将与公司无关",
];
const QUIPS_WEEKEND = [
  "今天的你没有 KPI 也没有微信群",
  "周末值班也是周末（雾",
  "假装明天没有周一",
  "今天可以理直气壮地不回工作消息",
  "醒不来就别醒",
  "公司？不熟",
];
const QUIPS_BEFORE = [
  "公司在催，被窝在挽留",
  "通勤的你像被打包的快递",
  "再赖一会儿，反正打卡也是迟到",
  "今天又是被闹钟杀死又复活的一天",
  "等会儿到工位，先泡个咖啡装满血",
];
const QUIPS_OFF = [
  "下班了，从牛马切换为人类",
  "工位的灯灭了，你的灵魂亮了",
  "晚安，我和公司不熟",
  "今天的工作让今天的你解决，明天再说",
  "夺门而出的成功率：100%",
];

let cdState = null;
const pad = n => String(Math.max(0, Math.floor(n))).padStart(2, "0");
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function cdTick(){
  const now = new Date();
  const dow = now.getDay();
  const start = new Date(now); start.setHours(WORK_START,0,0,0);
  const end   = new Date(now); end.setHours(WORK_END,0,0,0);

  let state, remainMs = 0, prog = 0;
  if (dow === 0 || dow === 6) state = "weekend";
  else if (now < start)       state = "before";
  else if (now < end)         state = "working";
  else                        state = "off";

  if (state === "working") {
    remainMs = end - now;
    prog = (now - start) / (end - start);
  } else if (state === "before") {
    remainMs = start - now;
  } else if (state === "off") {
    prog = 1;
  }

  let label, timeText;
  if (state === "weekend") {
    label = "今天周末"; timeText = "(´｡• ᵕ •｡`)";
    cdProg.style.width = "0%";
  } else if (state === "before") {
    label = "距上班还有";
    const s = remainMs / 1000;
    timeText = `${pad(s/3600)}:${pad((s/60)%60)}:${pad(s%60)}`;
    cdProg.style.width = "0%";
  } else if (state === "working") {
    label = "距下班还有";
    const s = remainMs / 1000;
    timeText = `${pad(s/3600)}:${pad((s/60)%60)}:${pad(s%60)}`;
    cdProg.style.width = (prog*100).toFixed(2) + "%";
  } else {
    label = "下班啦"; timeText = "🎉";
    cdProg.style.width = "100%";
  }
  cdLabel.textContent = label;
  cdTime.textContent  = timeText;

  // quip — change on state transition, or when working state crosses last-hour/last-10
  let phase = state;
  if (state === "working") {
    const remainMin = remainMs / 60000;
    if (remainMin <= 10)     phase = "working_10";
    else if (remainMin <= 60) phase = "working_60";
  }
  if (phase !== cdState) {
    const pool = phase === "working"    ? QUIPS_WORK
               : phase === "working_60" ? QUIPS_WORK_LAST_HOUR
               : phase === "working_10" ? QUIPS_WORK_LAST_10
               : phase === "weekend"    ? QUIPS_WEEKEND
               : phase === "before"     ? QUIPS_BEFORE
               : QUIPS_OFF;
    cdQuip.textContent = pick(pool);
    cdState = phase;
  }
}
cdTick();
setInterval(cdTick, 1000);

// re-roll a quip when clicking the countdown block (for endless 贱话)
document.getElementById("cd").addEventListener("click", e => {
  e.stopPropagation(); // don't also spawn click-hearts inside the block
  cdState = null;
  cdTick();
});

// ---- Visit counter (total only) ----
async function loadVisits(){
  const el = document.getElementById("visits");
  try{
    const r = await fetch("https://abacus.jasoncameron.dev/hit/hello-page-xingjia/main",
                          {cache:"no-store"});
    if(!r.ok) return;
    const j = await r.json();
    el.innerHTML = `✿ 累计访问 <b>${j.value}</b> 次`;
    el.classList.add("show");
  }catch(_){ /* offline / blocked / API down — stay hidden */ }
}
loadVisits();
</script>
</body>
</html>
