<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>摸鱼大作战 ✈ by hanxingjia</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#ffd6e8,#c5e0ff,#ffe5b4);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    user-select:none;}
  #wrap{position:relative;width:min(480px,100vw);height:min(720px,100vh);
    box-shadow:0 20px 60px rgba(0,0,0,.12);border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#ffe5f0,#fff5e6 60%,#ffe5b4);}
  canvas{display:block;width:100%;height:100%;cursor:none;}
  .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:10px 14px;font-size:14px;color:#555;z-index:5;pointer-events:none;
    text-shadow:0 1px 2px rgba(255,255,255,.7);}
  .back{position:absolute;top:8px;right:8px;z-index:20;
    background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
    border:none;border-radius:999px;padding:6px 14px;font-size:13px;
    color:#666;cursor:pointer;text-decoration:none;}
  .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;
    font-size:12px;color:#888;pointer-events:none;z-index:5;}
  .start,.over{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:15;
    background:rgba(255,230,240,.85);backdrop-filter:blur(6px);text-align:center;padding:20px;}
  .over{background:rgba(40,30,60,.78);color:#fff;}
  .start h1,.over h1{margin:0 0 8px;font-size:30px;color:#ff5491;}
  .over h1{color:#ffd6e8;}
  .start p,.over p{margin:6px 0;color:#666;font-size:14px;}
  .over p{color:#ddd;}
  .big{font-size:64px;font-weight:bold;color:#ffb3d9;margin:8px 0;
    text-shadow:0 0 20px rgba(255,150,200,.6);}
  .btn{margin-top:18px;padding:11px 28px;border:none;border-radius:999px;
    background:#ff6b9d;color:#fff;font-size:15px;cursor:pointer;
    box-shadow:0 6px 20px rgba(255,107,157,.4);}
  .btn:hover{background:#ff5491;}
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="./">← 回首页</a>
  <div class="top">
    <span id="score">分数 0</span>
    <span id="lives">♥♥♥</span>
  </div>
  <canvas id="game"></canvas>
  <div class="hint">移动鼠标 / 手指 控制 ・ 自动开火</div>

  <div class="start" id="start">
    <h1>✈ 摸鱼大作战</h1>
    <p>击落老板派来的 <b>会议 / 周报 / DDL</b></p>
    <p>撞到掉一颗 ♥，没血就 GG</p>
    <button class="btn" id="startBtn">开始摸鱼</button>
  </div>

  <div class="over" id="over" style="display:none">
    <h1>今天摸到</h1>
    <div class="big" id="finalScore">0</div>
    <p id="comment">明天继续摸~</p>
    <button class="btn" id="againBtn">再来一局</button>
  </div>
</div>

<script>
const cvs = document.getElementById("game");
const ctx = cvs.getContext("2d");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const startScreen = document.getElementById("start");
const overScreen  = document.getElementById("over");
const finalScoreEl= document.getElementById("finalScore");
const commentEl   = document.getElementById("comment");

function fitCanvas(){
  const rect = cvs.getBoundingClientRect();
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cvs.width  = Math.round(rect.width  * dpr);
  cvs.height = Math.round(rect.height * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

const W = () => cvs.getBoundingClientRect().width;
const H = () => cvs.getBoundingClientRect().height;

const ENEMY_WORDS = ["会议","周报","OKR","KPI","DDL","加班","996","改需求","紧急","钉一下"];
const COMMENTS = [
  "这水平，老板看了想给你升职（再让你加班）",
  "摸鱼界冉冉升起的新星 ✦",
  "不错不错，没让 DDL 砸到你头上",
  "再练练，今天的会议堆成山了",
  "唉…被 DDL 偷家了 :(",
];

let state, raf=null, running=false, pointerX=null;

function reset(){
  state = {
    player:{x:W()/2, y:H()-70, hit:0},
    bullets:[],
    enemies:[],
    particles:[],
    petals:[],
    score:0,
    lives:3,
    fireTimer:0,
    spawnTimer:600,
    t:0,
  };
  pointerX = W()/2;
  updateHud();
}

function updateHud(){
  scoreEl.textContent = "分数 " + state.score;
  livesEl.textContent = "♥".repeat(Math.max(0,state.lives)) + "♡".repeat(Math.max(0,3-state.lives));
}

// ----- Input -----
function onPointer(e){
  const rect = cvs.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  pointerX = Math.max(10, Math.min(rect.width-10, x));
}
cvs.addEventListener("mousemove", onPointer);
cvs.addEventListener("touchmove", e=>{ onPointer(e); e.preventDefault(); }, {passive:false});
cvs.addEventListener("touchstart", onPointer);

const keys = {};
window.addEventListener("keydown", e=>{ keys[e.key]=true;
  if(e.key===" " && !running) startGame();
});
window.addEventListener("keyup",   e=>{ keys[e.key]=false; });

// ----- Loop -----
function spawnEnemy(){
  const w = ENEMY_WORDS[Math.floor(Math.random()*ENEMY_WORDS.length)];
  const hp = w.length>=3 ? 2 : 1;
  state.enemies.push({
    x: 30 + Math.random()*(W()-60),
    y: -20,
    vy: 0.8 + Math.random()*1.0 + state.t*0.00008,
    vx: (Math.random()-0.5)*0.6,
    word: w,
    hp, maxHp: hp,
    r: 26,
  });
}

function explode(x,y,color){
  for(let i=0;i<10;i++){
    const a = Math.random()*Math.PI*2;
    const s = 1+Math.random()*3;
    state.particles.push({
      x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1,
      life:32, max:32,
      char: ["♥","♡","✿","✦"][Math.floor(Math.random()*4)],
      color,
      size: 12+Math.random()*10,
    });
  }
}

function spawnPetal(){
  state.petals.push({
    x: Math.random()*W(),
    y: -10,
    vy: 0.5+Math.random()*1.2,
    vx: (Math.random()-0.5)*0.6,
    rot: Math.random()*Math.PI*2,
    vrot:(Math.random()-0.5)*0.05,
    size: 6+Math.random()*8,
    a: 0.5+Math.random()*0.4,
  });
}

function update(dt){
  state.t += dt;
  // player follow
  const speed = 0.22;
  state.player.x += (pointerX - state.player.x) * speed;
  if(keys.ArrowLeft||keys.a||keys.A) state.player.x -= 5;
  if(keys.ArrowRight||keys.d||keys.D) state.player.x += 5;
  state.player.x = Math.max(20, Math.min(W()-20, state.player.x));
  if(state.player.hit>0) state.player.hit -= dt;

  // fire
  state.fireTimer -= dt;
  if(state.fireTimer<=0){
    state.bullets.push({x:state.player.x-7, y:state.player.y-18, vy:-7});
    state.bullets.push({x:state.player.x+7, y:state.player.y-18, vy:-7});
    state.fireTimer = 170;
  }
  // bullets
  for(const b of state.bullets) b.y += b.vy;
  state.bullets = state.bullets.filter(b => b.y > -20);

  // spawn enemies
  state.spawnTimer -= dt;
  if(state.spawnTimer<=0){
    spawnEnemy();
    state.spawnTimer = Math.max(380, 1000 - state.score*3);
  }
  // move enemies
  for(const e of state.enemies){
    e.y += e.vy;
    e.x += e.vx;
    if(e.x<25||e.x>W()-25) e.vx*=-1;
  }

  // collisions: bullet x enemy
  for(const e of state.enemies){
    if(e.hp<=0) continue;
    for(const b of state.bullets){
      if(b.y<-10) continue;
      const dx = b.x-e.x, dy=b.y-e.y;
      if(dx*dx+dy*dy < (e.r+6)*(e.r+6)){
        e.hp -= 1;
        b.y = -1000;
        if(e.hp<=0){
          state.score += 10 + (e.maxHp-1)*15;
          explode(e.x,e.y,"#ff5491");
        } else {
          explode(b.x,b.y,"#ffd6e8");
        }
      }
    }
  }
  state.enemies = state.enemies.filter(e=>e.hp>0 && e.y<H()+40);

  // collisions: enemy x player
  if(state.player.hit<=0){
    for(const e of state.enemies){
      const dx = e.x-state.player.x, dy=e.y-state.player.y;
      if(dx*dx+dy*dy < (e.r+18)*(e.r+18)){
        e.hp = 0;
        state.lives -= 1;
        state.player.hit = 1100;
        explode(state.player.x, state.player.y, "#a060c0");
        updateHud();
        if(state.lives<=0){ gameOver(); return; }
        break;
      }
    }
  }
  state.enemies = state.enemies.filter(e=>e.hp>0);

  // particles
  for(const p of state.particles){
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= dt*0.06;
  }
  state.particles = state.particles.filter(p=>p.life>0);

  // petals (bg)
  if(Math.random()<0.06) spawnPetal();
  for(const p of state.petals){
    p.y += p.vy; p.x += p.vx; p.rot += p.vrot;
  }
  state.petals = state.petals.filter(p=>p.y<H()+20);

  updateHud();
}

function drawHeart(x,y,size,color){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(size/16, size/16);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0,4);
  ctx.bezierCurveTo(-8,-6,-14,4,0,12);
  ctx.bezierCurveTo(14,4,8,-6,0,4);
  ctx.fill();
  ctx.restore();
}

function drawPlane(x,y,blink){
  ctx.save();
  ctx.translate(x,y);
  if(blink) ctx.globalAlpha = 0.4 + 0.5*Math.sin(state.t*0.03);
  // body
  ctx.fillStyle = "#ff6b9d";
  ctx.beginPath();
  ctx.moveTo(0,-18); ctx.lineTo(14,12); ctx.lineTo(0,6); ctx.lineTo(-14,12);
  ctx.closePath(); ctx.fill();
  // wing
  ctx.fillStyle = "#ffb3d9";
  ctx.beginPath();
  ctx.moveTo(-22,4); ctx.lineTo(22,4); ctx.lineTo(0,-4); ctx.closePath(); ctx.fill();
  // canopy
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(0,-6,4,0,Math.PI*2); ctx.fill();
  // exhaust
  ctx.fillStyle = "rgba(255,200,220,.7)";
  ctx.beginPath(); ctx.arc(-6,14,3,0,Math.PI*2); ctx.arc(6,14,3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  // cloud
  const dmg = 1 - e.hp/e.maxHp;
  ctx.save();
  ctx.fillStyle = `rgba(${80+dmg*60},${70+dmg*40},${110-dmg*30},0.85)`;
  ctx.beginPath();
  ctx.arc(e.x-14,e.y, 14,0,Math.PI*2);
  ctx.arc(e.x,e.y-6, 18,0,Math.PI*2);
  ctx.arc(e.x+14,e.y, 14,0,Math.PI*2);
  ctx.arc(e.x,e.y+6, 14,0,Math.PI*2);
  ctx.fill();
  // text
  ctx.fillStyle = "#fff";
  ctx.font = "bold 13px -apple-system,sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(e.word, e.x, e.y);
  ctx.restore();
}

function drawPetal(p){
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(p.rot);
  ctx.globalAlpha = p.a;
  ctx.fillStyle = "#ffb3d9";
  ctx.beginPath();
  ctx.ellipse(0,0,p.size*0.4,p.size*0.7,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W(),H());
  // bg petals
  for(const p of state.petals) drawPetal(p);
  // bullets
  for(const b of state.bullets) drawHeart(b.x,b.y,16,"#ff5491");
  // enemies
  for(const e of state.enemies) drawEnemy(e);
  // particles
  for(const p of state.particles){
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.color;
    ctx.font = `${p.size}px sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(p.char, p.x, p.y);
    ctx.restore();
  }
  // player
  drawPlane(state.player.x, state.player.y, state.player.hit>0);
}

let lastT = performance.now();
function loop(now){
  const dt = Math.min(40, now-lastT);
  lastT = now;
  if(running) update(dt);
  draw();
  raf = requestAnimationFrame(loop);
}

function startGame(){
  reset();
  startScreen.style.display = "none";
  overScreen.style.display  = "none";
  running = true;
  if(!raf){ lastT = performance.now(); raf = requestAnimationFrame(loop); }
}

function gameOver(){
  running = false;
  finalScoreEl.textContent = state.score + " 分";
  let idx = 4;
  if(state.score >= 300)      idx = 0;
  else if(state.score >= 180) idx = 1;
  else if(state.score >= 80)  idx = 2;
  else if(state.score >= 30)  idx = 3;
  commentEl.textContent = COMMENTS[idx];
  overScreen.style.display = "flex";
}

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", startGame);

// idle background draw before start
reset();
raf = requestAnimationFrame(loop);
</script>
</body>
</html>
