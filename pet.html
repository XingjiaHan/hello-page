<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>云养猫 🐱 by hanxingjia</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#ffe5f0,#fff5e6,#e6f0ff);
    background-size:300% 300%;animation:bg 18s ease infinite;
    user-select:none;}
  @keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .back{position:fixed;top:14px;right:14px;z-index:20;
    background:rgba(255,255,255,.7);backdrop-filter:blur(8px);
    border:none;border-radius:999px;padding:6px 14px;font-size:13px;
    color:#666;text-decoration:none;}

  .card{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
    border-radius:24px;padding:28px 30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.08);
    width:460px;max-width:94vw;}
  h1{margin:0 0 4px;font-size:22px;color:#444;font-weight:600;text-align:center;}
  h1 .name{color:#ff6b9d;}
  .welcome{font-size:12px;color:#a48fa8;text-align:center;min-height:16px;margin-bottom:14px;}

  .stats{display:flex;gap:10px;margin-bottom:16px;}
  .stat{flex:1;}
  .stat .lbl{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:3px;}
  .stat .bar{height:7px;background:rgba(0,0,0,.05);border-radius:999px;overflow:hidden;}
  .stat .bar>div{height:100%;border-radius:999px;transition:width .5s;}
  .stat.mood   .bar>div{background:linear-gradient(90deg,#ffb3d9,#ff6b9d);}
  .stat.hunger .bar>div{background:linear-gradient(90deg,#ffd9a0,#ff9d4a);}
  .stat.energy .bar>div{background:linear-gradient(90deg,#aee0ff,#5fb3ff);}

  .room{position:relative;height:320px;border-radius:18px;overflow:hidden;
    background:
      linear-gradient(180deg,transparent 65%,#cd9468 65%,#b07b4f 100%),
      linear-gradient(180deg,#fff0f5 0%,#ffe0eb 65%);
    box-shadow:inset 0 -8px 16px rgba(120,70,40,.18);}
  /* floor planks */
  .room::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;
    background:
      repeating-linear-gradient(90deg,
        transparent 0,transparent 64px,
        rgba(80,40,20,.16) 64px,rgba(80,40,20,.16) 66px),
      linear-gradient(180deg,#d4a070 0%,#b07b4f 100%);
    pointer-events:none;z-index:0;}

  /* window */
  .window{position:absolute;top:18px;right:26px;width:100px;height:90px;
    border:5px solid #fff;border-radius:6px;overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);z-index:1;}
  .window .sky{position:absolute;inset:0;
    background:linear-gradient(180deg,#a0d8ff,#dde9ff);
    transition:background 1.2s;}
  .window.morning   .sky{background:linear-gradient(180deg,#ffd9b3,#ffe6d5 60%,#cce5ff);}
  .window.noon      .sky{background:linear-gradient(180deg,#a0d8ff,#dde9ff);}
  .window.afternoon .sky{background:linear-gradient(180deg,#ffe5b4,#ffd6e8);}
  .window.evening   .sky{background:linear-gradient(180deg,#ff9ec7,#7b73c1);}
  .window.night     .sky{background:linear-gradient(180deg,#0f0a2e,#2d1b69);}
  /* sun / moon */
  .window .sun{position:absolute;top:14px;left:24px;width:22px;height:22px;
    border-radius:50%;background:radial-gradient(circle,#ffec99,#ffcc66);
    box-shadow:0 0 12px rgba(255,200,80,.5);transition:all 1.2s;}
  .window.evening .sun{background:radial-gradient(circle,#ffd6a0,#ff8a5c);
    box-shadow:0 0 16px rgba(255,140,80,.5);left:48px;top:38px;}
  .window.night .sun{background:radial-gradient(circle,#fff8d0,#d8d0a0);
    box-shadow:0 0 14px rgba(255,240,180,.4);width:18px;height:18px;
    left:62px;top:20px;}
  /* stars (night only) */
  .window .star{position:absolute;width:2px;height:2px;background:#fff;
    border-radius:50%;opacity:0;}
  .window.night .star{opacity:.9;animation:twinkle 2.5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1;box-shadow:0 0 3px #fff}}
  /* cross frame */
  .window::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;
    background:#fff;transform:translateX(-50%);z-index:3;}
  .window::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;
    background:#fff;transform:translateY(-50%);z-index:3;}

  /* cat bed */
  .cat-bed{position:absolute;bottom:8px;right:14px;width:96px;height:36px;z-index:1;
    pointer-events:none;}
  /* food bowl */
  .food-bowl{position:absolute;bottom:10px;left:18px;width:68px;height:30px;z-index:1;
    pointer-events:none;}
  /* scratch post */
  .scratch-post{position:absolute;bottom:14px;left:106px;width:54px;height:100px;z-index:1;
    pointer-events:none;}

  /* cat */
  .cat{position:absolute;width:96px;height:96px;cursor:pointer;
    transition:left 1.8s cubic-bezier(.4,.0,.6,1), top 1.8s cubic-bezier(.4,.0,.6,1);
    filter:drop-shadow(0 4px 5px rgba(0,0,0,.13));z-index:5;}
  .cat svg{display:block;width:100%;height:100%;overflow:visible;}
  .cat.react{animation:bounce .4s ease;}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  /* SVG inner animations */
  .blink-eye{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box;}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .tail-wag{animation:wag 2.5s ease-in-out infinite;transform-origin:bottom right;transform-box:fill-box;}
  @keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(8deg)}}

  .bubble{position:absolute;background:#fff;color:#444;font-size:13px;
    padding:5px 12px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.1);
    opacity:0;transition:opacity .3s;pointer-events:none;transform:translateX(-50%);
    white-space:nowrap;z-index:11;}
  .bubble.show{opacity:1;}
  .bubble::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#fff;}

  .ball{position:absolute;font-size:24px;pointer-events:none;
    transition:left 1.1s cubic-bezier(.4,1.5,.5,1), top 1.1s cubic-bezier(.4,1.5,.5,1);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));z-index:4;}

  .fheart{position:absolute;pointer-events:none;font-size:22px;font-weight:bold;
    animation:floatup 1.4s ease-out forwards;z-index:10;}
  @keyframes floatup{
    0%{opacity:0;transform:translate(-50%,0) scale(.5)}
    25%{opacity:1;transform:translate(-50%,-20px) scale(1.2)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,0)),-90px) scale(.8)}
  }

  .actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .actions button{padding:10px 20px;border:none;border-radius:999px;
    background:#ff6b9d;color:#fff;font-size:14px;cursor:pointer;
    box-shadow:0 4px 12px rgba(255,107,157,.3);transition:transform .15s;}
  .actions button:hover{transform:scale(1.05);background:#ff5491;}
  .actions button:disabled{background:#ddd;color:#888;cursor:not-allowed;
    box-shadow:none;transform:none;}

  .footer{margin-top:14px;font-size:11px;color:#bbb;text-align:center;}
  .footer .reset{color:#bbb;text-decoration:underline;cursor:pointer;margin-left:6px;}
</style>
</head>

    <ellipse cx="42" cy="84" rx="5.5" ry="3.5" fill="#ffb8d0" opacity="0.55"/>
    <ellipse cx="98" cy="84" rx="5.5" ry="3.5" fill="#ffb8d0" opacity="0.55"/>
    <path d="M66,82 L74,82 L70,86 Z" fill="#ff8aa8"/>
    <path d="M70,86 Q65,91 60,87 M70,86 Q75,91 80,87" stroke="#a06070" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M67,88 L67,93 L70,90 Z" fill="#fff" stroke="#a06070" stroke-width="0.5"/>
    ${WHISKERS}${PAWS}
    <text x="106" y="32" fill="#ff5491" font-size="20" font-weight="bold">!</text>
  </svg>`,
};

function setPose(name){
  cat.innerHTML = POSES[name] || POSES.sit;
}

// ----- Stats -----
const DECAY = { mood: 0.20, hunger: 0.40, energy: 0.12 };
const SLEEP_RECOVERY = 3;

function loadStats(){
  try{
    const s = JSON.parse(localStorage.getItem("pet_stats"));
    if (s && typeof s.mood === "number") return s;
  }catch(_){}
  return { mood: 90, hunger: 90, energy: 90 };
}
function clamp(){
  for (const k of ["mood","hunger","energy"])
    stats[k] = Math.max(0, Math.min(100, stats[k]));
}
function save(){
  localStorage.setItem("pet_stats", JSON.stringify(stats));
  localStorage.setItem("pet_lastVisit", String(Date.now()));
}

const stats = loadStats();
const lastVisit = parseInt(localStorage.getItem("pet_lastVisit") || Date.now(), 10);
const elapsedMin = Math.max(0, (Date.now() - lastVisit) / 60000);

const wasSleeping = stats.energy < 15;
if (wasSleeping){
  stats.energy += SLEEP_RECOVERY * elapsedMin;
  stats.mood   -= DECAY.mood   * elapsedMin;
  stats.hunger -= DECAY.hunger * elapsedMin;
} else {
  stats.mood   -= DECAY.mood   * elapsedMin;
  stats.hunger -= DECAY.hunger * elapsedMin;
  stats.energy -= DECAY.energy * elapsedMin;
}
clamp();

function fmtElapsed(min){
  if (min < 60)    return `${Math.round(min)} 分钟`;
  if (min < 60*24) return `${(min/60).toFixed(1)} 小时`;
  return `${Math.floor(min/60/24)} 天`;
}
if (elapsedMin >= 3){
  let msg;
  if (stats.hunger < 25 && stats.mood < 35)
    msg = `你走了 ${fmtElapsed(elapsedMin)}，咪咪又饿又委屈 😿`;
  else if (stats.hunger < 30)
    msg = `${fmtElapsed(elapsedMin)} 没回来，咪咪饿啦`;
  else if (stats.mood < 35)
    msg = `${fmtElapsed(elapsedMin)} 没人陪，咪咪不开心`;
  else if (wasSleeping && stats.energy > 80)
    msg = `咪咪睡了一觉，元气满满 ✨`;
  else
    msg = `欢迎回来 ~ 离开了 ${fmtElapsed(elapsedMin)}`;
  welcomeEl.textContent = msg;
}

function currentPose(){
  if (stats.energy < 15) return "sleep";
  if (stats.hunger < 20) return "hungry";
  if (stats.mood   < 25) return "sad";
  if (stats.mood > 70 && stats.hunger > 50) return "happy";
  return "sit";
}

let busy = false;

function updateUI(){
  moodBar.style.width   = stats.mood   + "%";
  hungerBar.style.width = stats.hunger + "%";
  energyBar.style.width = stats.energy + "%";
  moodNum.textContent   = Math.round(stats.mood);
  hungerNum.textContent = Math.round(stats.hunger);
  energyNum.textContent = Math.round(stats.energy);
  if (!busy) setPose(currentPose());
}

function showBubble(text, dur=1800){
  const cx = cat.offsetLeft + cat.offsetWidth/2;
  const cy = cat.offsetTop;
  bubble.style.left = cx + "px";
  bubble.style.top  = (cy - 30) + "px";
  bubble.textContent = text;
  bubble.classList.add("show");
  clearTimeout(showBubble._t);
  showBubble._t = setTimeout(() => bubble.classList.remove("show"), dur);
}

function spawnHearts(){
  for (let i = 0; i < 5; i++){
    const h = document.createElement("div");
    h.className = "fheart";
    h.textContent = ["♥","♡","✿","✦"][Math.floor(Math.random()*4)];
    h.style.left = (cat.offsetLeft + cat.offsetWidth/2 + (Math.random()*40-20)) + "px";
    h.style.top  = (cat.offsetTop + 14) + "px";
    h.style.color = ["#ff6b9d","#ffb3d9","#ff5491","#ffc1d8"][Math.floor(Math.random()*4)];
    h.style.fontSize = (18 + Math.random()*10) + "px";
    h.style.setProperty("--dx", (Math.random()*70-35) + "px");
    room.appendChild(h);
    setTimeout(() => h.remove(), 1400);
  }
}

// positions for activities (anchor: cat div top-left)
function bedPos(){
  return { x: room.clientWidth - 106, y: room.clientHeight - 124 };
}
function bowlPos(){
  return { x: 6, y: room.clientHeight - 130 };
}
function randomFloorPos(){
  // wander between bowl/scratch-post area and cat-bed
  const minX = 170;
  const maxX = Math.max(minX+1, room.clientWidth - 200);
  return {
    x: minX + Math.random()*(maxX-minX),
    y: room.clientHeight - 122 - Math.random()*16,
  };
}

function moveCatTo(pos){
  cat.style.left = pos.x + "px";
  cat.style.top  = pos.y + "px";
}

function wander(){
  if (stats.energy < 15){ moveCatTo(bedPos()); return; }
  if (busy) return;
  moveCatTo(randomFloorPos());
}

function pet(){
  if (busy) return;
  stats.mood   += 12;
  stats.energy -= 1;
  clamp(); save();
  busy = true;
  setPose(stats.mood > 70 && stats.hunger > 50 ? "happy" : "sit");
  cat.classList.add("react");
  setTimeout(() => cat.classList.remove("react"), 380);
  showBubble("咕噜咕噜~", 1500);
  spawnHearts();
  setTimeout(() => { busy = false; updateUI(); }, 1500);
}

function feed(){
  if (busy) return;
  stats.hunger += 30;
  stats.mood   += 4;
  clamp(); save();
  busy = true;
  moveCatTo(bowlPos());
  setTimeout(() => {
    setPose("eat");
    showBubble("好吃！", 1800);
  }, 1800);
  setTimeout(() => { busy = false; updateUI(); }, 3700);
}

function play(){
  if (busy) return;
  if (stats.energy < 12){
    busy = true;
    setPose("sleep");
    showBubble("咪咪打哈欠…睡会儿", 1600);
    setTimeout(() => { busy = false; updateUI(); }, 1700);
    return;
  }
  stats.energy -= 10;
  stats.mood   += 10;
  stats.hunger -= 5;
  clamp(); save();
  busy = true;

  const ball = document.createElement("div");
  ball.className = "ball";
  ball.textContent = "🎾";
  ball.style.left = "20px";
  ball.style.top  = (room.clientHeight - 50) + "px";
  room.appendChild(ball);

  const tx = 30 + Math.random()*(room.clientWidth - 200);
  requestAnimationFrame(() => {
    ball.style.left = tx + "px";
    ball.style.top  = (room.clientHeight - 30) + "px";
  });

  setPose("pounce");
  setTimeout(() => moveCatTo({ x: tx-30, y: room.clientHeight - 122 }), 300);
  setTimeout(() => {
    ball.remove();
    setPose("happy");
    showBubble("玩耍超开心！", 1500);
  }, 2300);
  setTimeout(() => { busy = false; updateUI(); }, 3800);
}

// ----- Window time-of-day -----
function windowState(){
  const h = new Date().getHours();
  if (h>=5  && h<11) return "morning";
  if (h>=11 && h<14) return "noon";
  if (h>=14 && h<18) return "afternoon";
  if (h>=18 && h<20) return "evening";
  return "night";
}
function updateWindow(){
  windowEl.className = "window " + windowState();
}

// init
updateWindow();
moveCatTo({ x: 200, y: room.clientHeight - 122 });
updateUI();
save();

setInterval(wander, 7000);
setTimeout(wander, 1500);

setInterval(() => {
  if (stats.energy < 15){
    stats.energy += SLEEP_RECOVERY / 6;
  } else {
    stats.energy -= DECAY.energy / 6;
  }
  stats.mood   -= DECAY.mood   / 6;
  stats.hunger -= DECAY.hunger / 6;
  clamp(); save(); updateUI();
}, 10000);

setInterval(updateWindow, 60000);

cat.addEventListener("click", pet);
document.getElementById("petBtn").addEventListener("click", pet);
document.getElementById("feedBtn").addEventListener("click", feed);
document.getElementById("playBtn").addEventListener("click", play);

document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("真的要让咪咪重新出生吗？")) return;
  localStorage.removeItem("pet_stats");
  localStorage.removeItem("pet_lastVisit");
  location.reload();
});

window.addEventListener("beforeunload", save);
window.addEventListener("pagehide", save);
</script>
</body>
</html>
